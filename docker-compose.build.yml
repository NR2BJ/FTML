# 소스 수정 검증용. Portainer 편집기에서는 이 파일을 사용하지 않는다.
services:
  ftml-frontend:
    image: ftml-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
  ftml-backend:
    image: ftml-backend:local
