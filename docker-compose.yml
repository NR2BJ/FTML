services:
  frontend:
    image: ${FTML_IMAGE_PREFIX:-ghcr.io/nr2bj/ftml}-frontend:${FTML_TAG:-latest}
    platform: linux/amd64
    ports:
      - "${FTML_PORT:-7979}:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    image: ${FTML_IMAGE_PREFIX:-ghcr.io/nr2bj/ftml}-backend:${FTML_TAG:-latest}
    platform: linux/amd64
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    expose:
      - "8080"
    volumes:
      # 미디어는 읽기 전용이다. 자막과 캐시는 /data에 저장한다.
      - type: bind
        source: ${MEDIA_PATH:-/mnt/storage/video}
        target: /media
        read_only: true
        bind:
          create_host_path: false
      - ftml_data:/data
    environment:
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?기존 관리자 암호 또는 새 설치 암호를 지정하세요}
      - JWT_SECRET=${JWT_SECRET:-}
      - MEDIA_PATH=/media
      - DATA_PATH=/data
      - DB_PATH=/data/videostream.db
      - SUBTITLE_PATH=/data/subtitles
      - PORT=8080
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - LIBVA_DRIVER_NAME=iHD
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:?호스트 GPU render 장치의 GID를 지정하세요}"
      - "${VIDEO_GID:?호스트 GPU card 장치의 GID를 지정하세요}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Whisper large-v3 INT8 기본값, Qwen은 자막 작업 창에서 선택한다.
  whisper:
    image: ${FTML_IMAGE_PREFIX:-ghcr.io/nr2bj/ftml}-whisper:${FTML_TAG:-latest}
    platform: linux/amd64
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    environment:
      - DEVICE=${WHISPER_DEVICE:-GPU}
      - CHUNK_DURATION_S=${WHISPER_CHUNK_SECONDS:-300}
      - CHUNK_OVERLAP_S=${WHISPER_OVERLAP_SECONDS:-5}
      - WHISPER_WORD_TIMESTAMPS=${WHISPER_WORD_TIMESTAMPS:-true}
      - WHISPER_SPEECH_BOUNDARIES=${WHISPER_SPEECH_BOUNDARIES:-true}
      - GAP_THRESHOLD_S=${WHISPER_GAP_SECONDS:-15}
      # 배경음만 있는 빈 구간에 환각을 추가하지 않도록 재인식은 명시적으로만 사용한다.
      - GAP_MAX_RETRY_S=${WHISPER_GAP_RETRY_SECONDS:-0}
      - QWEN_MODEL_REVISION=${QWEN_MODEL_REVISION:-}
      - QWEN_ALIGNER_REVISION=${QWEN_ALIGNER_REVISION:-}
      - QWEN_ALIGNER_THREADS=${QWEN_ALIGNER_THREADS:-4}
      - IDLE_TIMEOUT=${WHISPER_IDLE_SECONDS:-120}
      - MODEL_REVISION=${WHISPER_MODEL_REVISION:-}
    volumes:
      # 같은 볼륨의 기존 hub/ 구조를 유지한다. 미디어는 백엔드가 음성으로 전달한다.
      - whisper_models:/models
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:?호스트 GPU render 장치의 GID를 지정하세요}"
      - "${VIDEO_GID:?호스트 GPU card 장치의 GID를 지정하세요}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8178/health')"]
      interval: 30s
      timeout: 15s
      retries: 3

volumes:
  ftml_data:
    external: true
  whisper_models:
    external: true
