services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FTML_PORT:-7979}:80"
    depends_on:
      - backend
    networks:
      - homeserver-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    expose:
      - "8080"
    volumes:
      # 관리자 파일 관리를 위해 기본값은 읽기/쓰기다.
      - type: bind
        source: ${MEDIA_PATH:-/mnt/storage/video}
        target: /media
        read_only: ${MEDIA_READ_ONLY:-false}
        bind:
          create_host_path: false
      - ftml_data:/data
    environment:
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      - JWT_SECRET=${JWT_SECRET:-}
      - MEDIA_PATH=/media
      - DATA_PATH=/data
      - DB_PATH=/data/videostream.db
      - SUBTITLE_PATH=/data/subtitles
      # WHISPER_MODEL_PATH no longer needed — models cached on whisper container
      - PORT=8080
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - LIBVA_DRIVER_NAME=iHD
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:?호스트 GPU render 장치의 GID를 지정하세요}"
      - "${VIDEO_GID:?호스트 GPU card 장치의 GID를 지정하세요}"
    networks:
      - homeserver-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Whisper STT - OpenVINO GenAI (Intel Arc GPU accelerated)
  # Model is managed via web UI Settings — no MODEL_ID env var needed
  whisper:
    build:
      context: ./whisper
      dockerfile: Dockerfile.openvino-genai
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    environment:
      - DEVICE=${WHISPER_DEVICE:-GPU}
      - CHUNK_DURATION_S=${WHISPER_CHUNK_SECONDS:-300}
      - CHUNK_OVERLAP_S=${WHISPER_OVERLAP_SECONDS:-5}
      - WHISPER_WORD_TIMESTAMPS=${WHISPER_WORD_TIMESTAMPS:-true}
      - GAP_THRESHOLD_S=${WHISPER_GAP_SECONDS:-15}
      - GAP_MAX_RETRY_S=${WHISPER_GAP_RETRY_SECONDS:-300}
      - IDLE_TIMEOUT=${WHISPER_IDLE_SECONDS:-120}
      - MODEL_REVISION=${WHISPER_MODEL_REVISION:-}
    volumes:
      # 같은 볼륨의 기존 hub/ 구조를 유지한다. 미디어는 백엔드가 음성으로 전달한다.
      - whisper_models:/models
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:?호스트 GPU render 장치의 GID를 지정하세요}"
      - "${VIDEO_GID:?호스트 GPU card 장치의 GID를 지정하세요}"
    networks:
      - homeserver-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8178/health')"]
      interval: 30s
      timeout: 15s
      retries: 3

volumes:
  ftml_data:
    external: true
  whisper_models:
    external: true

networks:
  homeserver-net:
    external: true
